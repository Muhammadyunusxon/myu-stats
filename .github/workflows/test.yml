name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Liquid Glass (glassEffect) needs the macOS 26 SDK to compile.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build (strict concurrency checking)
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test
      - name: Bundle
        run: ./Scripts/bundle.sh
